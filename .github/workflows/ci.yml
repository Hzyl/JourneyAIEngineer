name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan source for common secret markers without logging values
        run: python scripts/source_secrets.py
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt
          python -m pip check
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify catalog fingerprint
        run: python scripts/catalog_version.py
      - name: Validate curriculum
        run: npm run validate
      - name: Prepare Python test directories
        shell: pwsh
        run: New-Item -ItemType Directory -Path .build -Force | Out-Null
      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q --basetemp .build\pytest-ci -o cache_dir=.build\pytest-cache
      - name: Run passive security inventory
        shell: pwsh
        run: python scripts/security_audit.py --format summary
      - name: Lint frontend
        run: npm run lint
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for browser smoke test
        run: npx playwright install chromium
      - name: Run browser smoke test
        shell: pwsh
        run: npm run test:e2e
      - name: Run production web learning and account regression tests
        shell: pwsh
        run: npm run test:e2e:production
  hosted-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Start Supabase and apply migrations
        shell: bash
        run: |
          sed -i 's/^project_id = .*/project_id = "journey-readiness-ci"/' supabase/config.toml
          npx supabase start
          npx supabase db reset
      - name: Test schema, RLS and RPC boundary
        run: npx supabase test db
      - name: Verify conditional trigger migration and concurrent writes
        run: python3 scripts/test_db_concurrency.py --container supabase_db_journey-readiness-ci
      - name: Verify generated database types
        shell: bash
        run: |
          npm run supabase:types
          git diff --exit-code -- src/platform/hosted/database.types.ts
      - name: Capture local hosted test variables
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
      - name: Build hosted frontend
        shell: bash
        run: VITE_APP_MODE=hosted npm run build
      - name: Install Chromium for hosted smoke test
        run: npx playwright install --with-deps chromium
      - name: Run hosted browser boundary smoke
        shell: bash
        run: VITE_APP_MODE=hosted npm run test:e2e:hosted
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
